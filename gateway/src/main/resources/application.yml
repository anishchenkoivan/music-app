server:
  port: 8080

spring:
  application:
    name: gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=1

            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/user/**
              filters:
                - StripPrefix=1

            - id: music-service-albums
              uri: lb:music-service
              predicates:
                - Path=/api/albums/**
              filters:
                - StripPrefix=1

            - id: music-service-tracks
              uri: lb:music-service
              predicates:
                - Path=/api/tracks/**
              filters:
                - StripPrefix=1

            - id: music-service-artists
              uri: lb:music-service
              predicates:
                - Path=/api/artists/**
              filters:
                - StripPrefix=1

            - id: music-service-playlists
              uri: lb:music-service
              predicates:
                - Path=/api/playlists/**
              filters:
                - StripPrefix=1

            - id: music-service-user
              uri: lb:music-service
              predicates:
                - Path=/api/user/**
              filters:
                - StripPrefix=1

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka